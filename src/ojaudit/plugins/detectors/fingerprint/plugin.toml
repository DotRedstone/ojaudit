name = "builtin_pair"
kind = "detector.pair"
version = "2.0.0"
api_version = 1
description = "Winnowing 指纹相似度：作为线索的参考指标；可设下限作为额外过滤条件"
languages = ["cpp", "python", "java", "other"]
module = "ojaudit.plugins.detectors.fingerprint"

[params]

[params.threshold]
type = "float"
label = "指纹相似度下限"
description = "额外要求原文指纹 Jaccard 不低于该值；0 表示不限制（推荐，变量改名会拉低指纹相似度）；命令行 --threshold 优先"
default = 0.0
min = 0
max = 1

[params.k]
type = "int"
label = "指纹 k-gram 长度"
description = "去空白去注释后按字符切片的长度"
default = 5
min = 1

[params.window]
type = "int"
label = "Winnowing 窗口大小"
description = "每个窗口取最小哈希作为指纹"
default = 4
min = 1
