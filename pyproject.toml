[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "ojaudit"
version = "0.1.0.dev0"
description = "可扩展的训练赛代码审查框架"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.8"]

[project.scripts]
ojaudit = "ojaudit.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/ojaudit"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"
